<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zstack</title>
    <script>
      (function() {
        try {
          var setting = localStorage.getItem('zstack:theme') || 'light';
          var isDark = setting === 'dark' || (setting === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme-setting', setting);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          if (localStorage.getItem('zstack:sidebar-collapsed') === 'true') {
            document.documentElement.classList.add('sidebar-collapsed-init');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" type="image/png" id="favicon" href="/assets/zLogo1.png" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar__head">
          <div class="workspace-row">
            <div class="workspace" id="workspace-header" role="button" tabindex="0" title="Go to Dashboard">
              <span class="workspace__mark">
                <img class="workspace__logo workspace__logo--light" src="/assets/zLogo1.png" alt="zStack" />
                <img class="workspace__logo workspace__logo--dark" src="/assets/zLogo_White.png" alt="zStack" />
              </span>
              <div class="workspace__meta">
                <span class="workspace__name">zstack</span>
                <span class="workspace__sub">Local workspace</span>
              </div>
              <span class="workspace__dropdown">⌄</span>
            </div>
            <button class="sidebar__toggle-btn" id="btn-collapse-sidebar" type="button" title="Collapse sidebar (Ctrl+\)" aria-label="Collapse sidebar">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
            </button>
          </div>
          <button class="quick-new-run" id="btn-quick-new-run" type="button" title="Start a new agent or task run (C)">
            <svg class="quick-new-run__icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span class="quick-new-run__label">New run</span>
            <kbd class="quick-new-run__kbd">C</kbd>
          </button>
          <div class="search">
            <svg class="search__icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Search runs..."
              aria-label="Search runs"
              autocomplete="off"
              spellcheck="false"
            />
            <kbd class="search__kbd">/</kbd>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar__foot" id="footer"></div>
      </aside>
      <main class="main">
        <div class="topbar" id="topbar"></div>
        <div id="view">
          <div class="loading">Loading runs...</div>
        </div>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
